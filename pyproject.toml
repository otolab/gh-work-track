[project]
name = "gh-work-track"
version = "0.1.0"
description = "GitHub work event tracker with LanceDB storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Naoto Kato" }]
dependencies = [
  "lancedb>=0.30.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
gh-work-track = "gh_work_track.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_work_track"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
